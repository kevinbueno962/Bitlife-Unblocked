<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents double-tap zooming on iOS Safari and mobile Chrome/Linux touch devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Play BitLife Online</title>
    <style>
        /* Universal reset prevents system selection bars or highlights from getting stuck */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-drag: none; 
        }

        /* Remove default margins and padding to make it seamless */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: fixed; /* Prevents viewport rubber-banding on mobile systems */
            touch-action: none; /* Stops native drag-scrolling behavior outside the frame */
        }

        /* Styling for the game container */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* Enforces hardware GPU layer composition across Windows DirectX and macOS Metal threads */
            will-change: transform;
            transform: translateZ(0); 
        }

        /* The iframe holding the web-based game */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            touch-action: auto;
            pointer-events: auto;
        }

        /* Floating Fullscreen Button on the right */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 9999; /* Ensures it stays on top of the iframe */
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }

        /* Hover effect for the button */
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .game-container:hover .fullscreen-btn {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <!-- Visible Toggle Button -->
        <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen (Ctrl+M)">
            ⛶ Fullscreen
        </button>

        <!-- Embedding BitLife via the open-source web-deployed proxy -->
        <iframe id="gameFrame" src="https://github.io" allowfullscreen="true" scrolling="no"></iframe>
    </div>

    <script>
        const container = document.getElementById('gameContainer');
        const btn = document.getElementById('fullscreenBtn');
        const frame = document.getElementById('gameFrame');

        // Centralized function to handle entering and exiting fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.msFullscreenElement) {
                // Enter fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari / macOS / iOS */
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { /* IE11 / Legacy Windows */
                    container.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari / macOS / iOS */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 / Legacy Windows */
                    document.msExitFullscreen();
                }
            }
        }

        // Listen for the button click
        btn.addEventListener('click', toggleFullscreen);

        // Listen for the Ctrl + M hotkey (Works natively on Windows Ctrl and macOS Cmd/Meta keys)
        window.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'm') {
                event.preventDefault(); 
                toggleFullscreen();
            }
        });

        // Universal handler for gesture prevention (stops ChromeOS/iOS layout scale bugs)
        function blockSystemGestures(e) {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }
        document.addEventListener('touchstart', blockSystemGestures, { passive: false });
        document.addEventListener('touchmove', blockSystemGestures, { passive: false });

        // Update button text depending on fullscreen state
        const events = ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'];
        events.forEach(ev => document.addEventListener(ev, updateButtonText));

        function updateButtonText() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                btn.innerHTML = '🗗 Exit Fullscreen';
            } else {
                btn.innerHTML = '⛶ Fullscreen';
            }
        }

        // Windows & macOS Fix: Automatically wakes up standard Web Audio API contexts 
        // inside the core iframe target as soon as the user touches/clicks anywhere on the window.
        window.addEventListener('click', () => {
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'PLAYER_INTERACTED' }, '*');
            }
        }, { once: true });
    </script>

</body>
</html>
